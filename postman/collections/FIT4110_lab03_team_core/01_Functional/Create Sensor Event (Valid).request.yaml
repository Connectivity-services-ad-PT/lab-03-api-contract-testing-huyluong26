$kind: http-request
url: "{{baseUrl}}/events"
method: POST
headers:
  Authorization: Bearer {{authToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "eventType": "SENSOR_READING",
      "eventId": "0196fb3d-4ad7-7d1e-9f49-5d5148d2babc",
      "deviceId": "SENSOR-001",
      "metric": "temperature",
      "value": 38.5,
      "unit": "celsius",
      "timestamp": "2026-05-10T08:00:00Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Event accepted", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property('eventId');
          pm.expect(json).to.have.property('acceptedAt');
      });
    language: text/javascript
order: 1000
