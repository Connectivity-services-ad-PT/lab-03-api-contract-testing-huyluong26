$kind: http-request
url: "{{baseUrl}}/access/check"
method: POST
headers:
  Authorization: Bearer {{authToken}}
  Idempotency-Key: req-12345
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "cardId": "RFID-2026-001",
      "gateId": "GATE-01",
      "timestamp": "2026-05-10T08:01:00Z"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Returns decision", function () {
          var json = pm.response.json();
          pm.expect(json.decision).to.be.oneOf(['ALLOW', 'DENY']);
      });
    language: text/javascript
order: 2000
